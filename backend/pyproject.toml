[project]
name = "zuhdemy-ai-tutor-backend"
version = "0.1.0"
description = "ZuhDemy Real-Time Low-Latency AI Tutor Backend (Overlapping Streaming Pipeline + Barge-In Preemption FSM)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "websockets>=13.1",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "python-dotenv>=1.0.1",
    "httpx>=0.27.2",
    "openai>=1.54.0",
    "numpy>=1.26.4",
]

[project.scripts]
dev = "app.main:start_server"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.uv]
managed = true
dev-dependencies = []

